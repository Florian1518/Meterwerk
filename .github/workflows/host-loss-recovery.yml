name: Mosquitto AppArmor and host-loss recovery

on:
  push:
    branches: [software-completion/phase-3-ionos]
    paths:
      - .github/workflows/host-loss-recovery.yml
      - scripts/hostloss-apparmor*
      - scripts/offsite-storage.py
      - scripts/offsite-host-loss.sh
      - scripts/verify-host-loss-evidence.mjs
      - Dockerfile.offsite-mosquitto
      - infra/mosquitto/mosquitto.conf

permissions:
  contents: read

concurrency:
  group: host-loss-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host-loss:
    name: AppArmor persistence gate then isolated host loss
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meterwerk
          POSTGRES_PASSWORD: ci-only-recovery-password
          POSTGRES_DB: meterwerk
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U meterwerk -d meterwerk"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://meterwerk:ci-only-recovery-password@127.0.0.1:5432/meterwerk
      SESSION_SECRET: ci-only-synthetic-session-secret
      NODE_ENV: test
      METERWERK_ENV: test
      SEED_DEMO: "true"
      DEMO_PASSWORD: ci-only-synthetic-demo-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: Test exact AppArmor bootstrap rules
        run: node --test scripts/hostloss-apparmor.test.mjs
      - name: Reproduce, allow and verify Mosquitto persistence
        run: bash scripts/hostloss-apparmor-regression.sh
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        if: ${{ success() }}
        with: { version: 12.5.1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ success() }}
        with: { node-version: 22 }
      - name: Install offsite client
        if: ${{ success() }}
        run: |
          python3 -m venv "$RUNNER_TEMP/offsite-sdk"
          "$RUNNER_TEMP/offsite-sdk/bin/pip" install 'boto3==1.40.0'
          echo "$RUNNER_TEMP/offsite-sdk/bin" >> "$GITHUB_PATH"
      - name: Install age and PostgreSQL 16 client
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes age ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Install project and prepare synthetic source database
        if: ${{ success() }}
        run: |
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm exec prisma migrate deploy
          pnpm db:seed
      - name: Create ephemeral age identity and encrypted recovery source
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          age-keygen -o "$RUNNER_TEMP/meterwerk-age-identity" 2>/dev/null
          chmod 600 "$RUNNER_TEMP/meterwerk-age-identity"
          echo "METERWERK_BACKUP_AGE_IDENTITY_FILE=$RUNNER_TEMP/meterwerk-age-identity" >> "$GITHUB_ENV"
          echo "METERWERK_BACKUP_AGE_RECIPIENT=$(age-keygen -y "$RUNNER_TEMP/meterwerk-age-identity")" >> "$GITHUB_ENV"
          backup="$RUNNER_TEMP/meterwerk-${GITHUB_SHA}-$(date -u +%Y%m%dT%H%M%SZ).age"
          pnpm db:backup backup "$backup"
          pnpm db:backup verify "$backup"
          echo "METERWERK_BACKUP_FILE=$backup" >> "$GITHUB_ENV"
          echo "METERWERK_BACKUP_MANIFEST=$backup.manifest.json" >> "$GITHUB_ENV"
      - name: Upload and retrieve the exact encrypted recovery source
        if: ${{ success() }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.IONOS_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IONOS_S3_SECRET_KEY }}
          IONOS_S3_BUCKET: ${{ vars.IONOS_S3_BUCKET }}
          IONOS_S3_REGION: ${{ vars.IONOS_S3_REGION }}
          IONOS_S3_ENDPOINT: ${{ vars.IONOS_S3_ENDPOINT }}
        run: python3 scripts/offsite-storage.py roundtrip "$METERWERK_BACKUP_FILE" "$RUNNER_TEMP/offsite-full.json"
      - name: Run complete host-loss drill in an empty isolated Docker daemon
        if: ${{ success() }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.IONOS_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IONOS_S3_SECRET_KEY }}
          IONOS_S3_BUCKET: ${{ vars.IONOS_S3_BUCKET }}
          IONOS_S3_REGION: ${{ vars.IONOS_S3_REGION }}
          IONOS_S3_ENDPOINT: ${{ vars.IONOS_S3_ENDPOINT }}
        run: bash scripts/offsite-host-loss.sh
      - name: Verify full host-loss evidence
        if: ${{ success() }}
        run: node scripts/verify-host-loss-evidence.mjs "$RUNNER_TEMP/offsite-full.json" "$RUNNER_TEMP/offsite-host-loss.json" "$RUNNER_TEMP/offsite-host-verifier.json" "$GITHUB_SHA"
      - name: Restore original AppArmor override and profile
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/meterwerk-apparmor-evidence"
          node scripts/hostloss-apparmor.mjs cleanup 2>&1 | tee "$RUNNER_TEMP/meterwerk-apparmor-evidence/cleanup.log"
      - name: Archive Mosquitto, AppArmor and host-loss evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-loss-apparmor-evidence
          path: |
            ${{ runner.temp }}/meterwerk-apparmor-evidence/*.log
            ${{ runner.temp }}/offsite-full.json
            ${{ runner.temp }}/offsite-host-loss.json
            ${{ runner.temp }}/offsite-host-verifier.json
          retention-days: 30
      - name: Clean ephemeral secrets and recovery files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/meterwerk-age-identity"
          rm -f "$RUNNER_TEMP"/meterwerk-*.age "$RUNNER_TEMP"/meterwerk-*.age.manifest.json
          rm -f "$RUNNER_TEMP/meterwerk-apparmor-evidence/"*-mosquitto.db
