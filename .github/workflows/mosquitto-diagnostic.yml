name: Mosquitto runtime diagnosis
on:
  push:
    branches: [diagnostics/phase-3-mosquitto]
    paths:
      - scripts/mosquitto-diagnose.sh
      - .github/workflows/mosquitto-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: bash scripts/mosquitto-diagnose.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mosquitto-runtime-evidence
          path: ${{ runner.temp }}/mosquitto-diagnostic/evidence.log
          if-no-files-found: error
