name: Publish Images
on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer or RC version"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  quality:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
  publish:
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: meterwerk
          POSTGRES_PASSWORD: meterwerk
          POSTGRES_DB: meterwerk
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U meterwerk -d meterwerk"
          --health-interval=10s --health-timeout=5s --health-retries=10
      mqtt:
        image: eclipse-mosquitto:2
        ports: ["1883:1883"]
    env:
      APP_URL: http://localhost:3000
      METERWERK_ENV: test
      NEXT_PUBLIC_METERWERK_ENV: test
      NODE_ENV: production
      GIT_COMMIT_SHA: ${{ github.sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      DATABASE_URL: postgresql://meterwerk:meterwerk@localhost:5432/meterwerk
      SESSION_SECRET: ci-only-synthetic-session-secret
      MFA_ENCRYPTION_KEY: ci-only-synthetic-mfa-key-32-bytes
      WEBHOOK_SECRET_ENCRYPTION_KEY: ci-only-synthetic-mfa-key-32-bytes
      SEED_DEMO: "true"
      DEMO_PASSWORD: ci-only-synthetic-demo-password
      EMAIL_PROVIDER: local
      ATTACHMENT_STORAGE: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - name: Capture source before generated evidence
        run: |
          node scripts/source-state.mjs "$RUNNER_TEMP/source-state.json"
          echo "SOURCE_STATE_FILE=$RUNNER_TEMP/source-state.json" >> "$GITHUB_ENV"
          echo "GIT_WORKING_TREE=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/source-state.json')).workingTree")" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 12.5.1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm db:generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm db:seed
      - run: pnpm migration:check
      - name: Record immutable build timestamp
        run: echo "BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm run sbom
      - run: node scripts/generate-dependency-audit.mjs
      - run: node scripts/release-artifact.mjs
      - run: node scripts/verify-release-artifact.mjs --pre-image
      - run: node scripts/verify-worker-image-static.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/standalone-runtime-smoke.mjs
      - name: Verify Docker daemon
        run: docker version && docker info
      - name: Build staging Web, Worker and migration images
        run: |
          git diff --exit-code -- src apps scripts prisma package.json pnpm-lock.yaml pnpm-workspace.yaml Dockerfile Dockerfile.worker Dockerfile.migrations
          docker build -f Dockerfile \
            --build-arg NEXT_PUBLIC_METERWERK_ENV=staging \
            --build-arg VERSION="$RELEASE_VERSION" \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg BUILD_TIMESTAMP="$BUILD_TIMESTAMP" \
            -t "meterwerk-web:$GITHUB_SHA" .
          docker build -f Dockerfile.worker \
            --build-arg GIT_WORKING_TREE="$GIT_WORKING_TREE" \
            --build-arg VERSION="$RELEASE_VERSION" \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg BUILD_TIMESTAMP="$BUILD_TIMESTAMP" \
            -t "meterwerk-worker:$GITHUB_SHA" .
          docker build -f Dockerfile.migrations \
            --build-arg VERSION="$RELEASE_VERSION" \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg BUILD_TIMESTAMP="$BUILD_TIMESTAMP" \
            -t "meterwerk-migrations:$GITHUB_SHA" .
      - name: Verify migration tooling without a database or network
        run: |
          docker run --rm --network none \
            -e DATABASE_URL=postgresql://127.0.0.1:5432/meterwerk_build \
            "meterwerk-migrations:$GITHUB_SHA" \
            sh -ec 'pnpm db:generate && pnpm exec prisma --version'
      - name: Verify migration runner against the isolated CI database
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            "meterwerk-migrations:$GITHUB_SHA" \
            sh -ec 'pnpm db:generate && pnpm db:migrate && pnpm exec prisma migrate status'
      - name: Smoke Web image
        env:
          METERWERK_WEB_IMAGE: meterwerk-web:${{ github.sha }}
        run: node scripts/verify-web-image-runtime.mjs
      - name: Smoke Worker image
        env:
          METERWERK_WORKER_IMAGE: meterwerk-worker:${{ github.sha }}
        run: node scripts/verify-worker-image-runtime.mjs
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish Web, Worker and migration images to GHCR
        run: |
          docker tag "meterwerk-web:$GITHUB_SHA" "ghcr.io/florian1518/meterwerk-web:$GITHUB_SHA"
          docker tag "meterwerk-worker:$GITHUB_SHA" "ghcr.io/florian1518/meterwerk-worker:$GITHUB_SHA"
          docker tag "meterwerk-migrations:$GITHUB_SHA" "ghcr.io/florian1518/meterwerk-migrations:$GITHUB_SHA"
          docker push "ghcr.io/florian1518/meterwerk-web:$GITHUB_SHA"
          docker push "ghcr.io/florian1518/meterwerk-worker:$GITHUB_SHA"
          docker push "ghcr.io/florian1518/meterwerk-migrations:$GITHUB_SHA"
      - name: Install pinned image security tools
        run: bash scripts/install-supply-chain-tools.sh
      - name: Scan final immutable digests and release files
        id: security
        run: node scripts/scan-release-images.mjs
      - name: Attest web build provenance
        id: provenance_web
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/florian1518/meterwerk-web
          subject-digest: ${{ steps.security.outputs.web_digest }}
          push-to-registry: true
      - name: Attest web SBOM
        id: sbom_web
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/florian1518/meterwerk-web
          subject-digest: ${{ steps.security.outputs.web_digest }}
          sbom-path: release-artifacts/security/web.cdx.json
          push-to-registry: true
      - name: Preserve web attestation bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance_web.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom_web.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" "release-artifacts/security/web.provenance.sigstore.json"
          cp "$SBOM_BUNDLE" "release-artifacts/security/web.sbom.sigstore.json"
      - name: Attest worker build provenance
        id: provenance_worker
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/florian1518/meterwerk-worker
          subject-digest: ${{ steps.security.outputs.worker_digest }}
          push-to-registry: true
      - name: Attest worker SBOM
        id: sbom_worker
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/florian1518/meterwerk-worker
          subject-digest: ${{ steps.security.outputs.worker_digest }}
          sbom-path: release-artifacts/security/worker.cdx.json
          push-to-registry: true
      - name: Preserve worker attestation bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance_worker.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom_worker.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" "release-artifacts/security/worker.provenance.sigstore.json"
          cp "$SBOM_BUNDLE" "release-artifacts/security/worker.sbom.sigstore.json"
      - name: Attest migrations build provenance
        id: provenance_migrations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/florian1518/meterwerk-migrations
          subject-digest: ${{ steps.security.outputs.migrations_digest }}
          push-to-registry: true
      - name: Attest migrations SBOM
        id: sbom_migrations
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/florian1518/meterwerk-migrations
          subject-digest: ${{ steps.security.outputs.migrations_digest }}
          sbom-path: release-artifacts/security/migrations.cdx.json
          push-to-registry: true
      - name: Preserve migrations attestation bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance_migrations.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom_migrations.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" "release-artifacts/security/migrations.provenance.sigstore.json"
          cp "$SBOM_BUNDLE" "release-artifacts/security/migrations.sbom.sigstore.json"
      - name: Attest release archive provenance
        id: archive_provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/*/web-build.tar
      - name: Preserve archive provenance
        env:
          BUNDLE: ${{ steps.archive_provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" release-artifacts/security/archive.provenance.sigstore.json
      - name: Finalize immutable release manifest
        run: node scripts/finalize-release-manifest.mjs
      - name: Sign accepted release manifest
        id: manifest_provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/release-manifest.json
      - name: Verify signed immutable promotion without deploying
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.manifest_provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" release-artifacts/release-manifest.sigstore.json
          node scripts/verify-release-artifact.mjs
          node scripts/verify-promotion.mjs release-artifacts "$GITHUB_SHA" "$RELEASE_VERSION" "$RUNNER_TEMP/promotion.env"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifact
          path: release-artifacts
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: container-runtime-evidence
          path: .local/acceptance/*image*
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-security-evidence
          path: release-artifacts/security
          if-no-files-found: error
          retention-days: 90
