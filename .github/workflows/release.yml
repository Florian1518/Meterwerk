name: Release Candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer or RC version
        required: true
        type: string
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  artifact:
    needs: quality
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      DATABASE_URL: postgresql://localhost:5432/meterwerk_build
      APP_URL: http://localhost:3000
      METERWERK_ENV: test
      NODE_ENV: production
      GIT_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 12.5.1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm sbom
      - run: node scripts/release-artifact.mjs
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          {
            name: release-artifact,
            path: release-artifacts,
            retention-days: 30,
          }
      - run: echo "Docker build and staging promotion are prepared but require an explicit deployment environment and registry credentials."
