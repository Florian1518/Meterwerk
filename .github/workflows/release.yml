name: Release Candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing product version (no tag is created)
        required: true
        type: string
permissions:
  contents: read
jobs:
  artifact:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-images.yml
    with:
      version: ${{ inputs.version }}
