name: Supported image vulnerabilities
on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: bash scripts/install-supply-chain-tools.sh
      - name: Read-only GHCR authentication
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - run: node scripts/scan-supported-images.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recurring-image-vulnerabilities
          path: release-artifacts/recurring
          if-no-files-found: error
          retention-days: 90
      - if: failure()
        run: |
          echo '::error::Image security incident: Operations must review the failed Supported image vulnerabilities run and archived findings. No deployment was performed.'
          echo 'Release security incident: follow docs/SUPPLY-CHAIN-PHASE-2.md; promotion is blocked pending triage.' >> "$GITHUB_STEP_SUMMARY"
