name: Synthetic Operational Alert Drill

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-alert-drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 12.5.1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run deterministic synthetic incidents
        env:
          OPERATIONAL_ALERT_EVIDENCE_FILE: artifacts/operational-alert/incidents.json
        run: |
          mkdir -p artifacts/operational-alert
          pnpm exec vitest run tests/operational-alert-drill.test.ts tests/wal-startup-readiness.test.ts tests/proxy-healthcheck.test.ts
      - name: Test WAL pipeline and recovery negative classifiers
        run: node --test tests/wal-offsite.test.mjs tests/recovery-negative-result.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: synthetic-operational-alert-${{ github.run_id }}
          path: artifacts/operational-alert/
          if-no-files-found: error
          retention-days: 30
