# Dedicated staging listener; never include the anonymous development config.
listener 8883
allow_anonymous false
cafile /mosquitto/secrets/ca.crt
certfile /mosquitto/secrets/server.crt
keyfile /mosquitto/secrets/server.key
crlfile /mosquitto/secrets/ca.crl
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
acl_file /mosquitto/config/staging.acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
