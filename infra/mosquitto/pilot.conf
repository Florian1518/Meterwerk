# Separate pilot broker; do not overlay the anonymous development listener.
listener 8883
allow_anonymous false
cafile /mosquitto/secrets/ca.crt
certfile /mosquitto/secrets/server.crt
keyfile /mosquitto/secrets/server.key
require_certificate true
use_identity_as_username true
crlfile /mosquitto/secrets/ca.crl
tls_version tlsv1.2
acl_file /mosquitto/config/pilot.acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
connection_messages true
